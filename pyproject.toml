[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erdos-straus-attack"
version = "0.4.0"
description = "Computational attack harness for the Erdős–Straus conjecture (hard-class primes)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "J. M. Hopkins", email = "jeff.m.hopkins@gmail.com" }]
dependencies = [
    "sympy>=1.12",
]

[project.urls]
Homepage = "https://github.com/jeffmhopkins/Erd-s-Straus-attack"

[project.optional-dependencies]
# Bulk generation (fast sieve) needs numpy; core solver/verify do not.
gen = [
    "numpy>=1.24",
]
dev = [
    "pytest>=7.0",
    "numpy>=1.24",
]

[project.scripts]
es-verify = "erdos_straus.verify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
